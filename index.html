<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/greenroom-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenroom</title>
    <script>
      if (location.hostname === 'localhost' || location.hostname.endsWith('.localhost') || location.hostname === '127.0.0.1' || location.hostname === '[::1]') {
        const prefix = '（测试）';
        const updateTitle = () => { if (!document.title.startsWith(prefix)) document.title = prefix + document.title; };
        updateTitle();
        new MutationObserver(updateTitle).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
